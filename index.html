<!DOCTYPE html>
<html lang="pl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Repsody</title>
<meta name="apple-mobile-web-app-title" content="Repsody">
<meta name="application-name" content="Repsody">
<meta name="theme-color" content="#C8102E">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<link rel="manifest" href="manifest.json">
<link rel="icon" type="image/png" sizes="32x32" href="favicon-32.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Big+Shoulders+Display:wght@700;800&family=IBM+Plex+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{
  /* Układ: jedna kolumna jak notes treningowy, zakładki u góry, liczby w równych kolumnach; kolory talerzy jako jedyny ozdobnik */
  --bg:#E8EBEE;
  --surface:#FFFFFF;
  --ink:#15181C;
  --muted:#5A626C;
  --line:#D2D7DD;
  --accent:#C8102E;
  --accent-ink:#FFFFFF;
  --accent-soft:#F8DEE2;
  --good:#17784A;
  --good-soft:#DCF1E5;
  --display:"Big Shoulders Display","Arial Narrow",Impact,sans-serif;
  --body:"IBM Plex Sans",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  --s1:#D2202F;--s2:#1F4FA8;--s3:#F2C230;--s4:#1E8A4C;--s5:#F4F4F2;--r:10px;--bg-img:none;
  color-scheme:light;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#0F1114; --surface:#191C21; --ink:#ECEEF1; --muted:#9AA3AD; --line:#2B3038;
    --accent:#FF5466; --accent-ink:#1B0709; --accent-soft:#3B1B21; --good:#4CC38A; --good-soft:#15301F;
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#0F1114; --surface:#191C21; --ink:#ECEEF1; --muted:#9AA3AD; --line:#2B3038;
  --accent:#FF5466; --accent-ink:#1B0709; --accent-soft:#3B1B21; --good:#4CC38A; --good-soft:#15301F;
  color-scheme:dark;
}
*{box-sizing:border-box}
html,body{margin:0}
body{background-color:var(--bg);background-image:var(--bg-img);background-repeat:no-repeat;background-attachment:fixed;color:var(--ink);font-family:var(--body);font-size:16px;line-height:1.45;-webkit-font-smoothing:antialiased}
.wrap{max-width:600px;margin:0 auto;padding:0 16px 64px}
header.top{padding:22px 0 0}
.brand{display:flex;align-items:flex-end;justify-content:space-between;gap:12px;flex-wrap:wrap}
h1{font-family:var(--display);font-weight:800;font-size:52px;line-height:.9;letter-spacing:.5px;margin:0;text-transform:uppercase;text-wrap:balance}
.plates-stripe{display:flex;height:6px;margin:14px 0 0;border-radius:3px;overflow:hidden}
.plates-stripe span{flex:1}
.sync{display:inline-flex;align-items:center;gap:6px;font-size:13px;color:var(--muted);padding:4px 10px;border:1px solid var(--line);border-radius:999px;background:var(--surface)}
.sync i{width:8px;height:8px;border-radius:50%;background:var(--muted);display:inline-block}
.sync.ok i{background:var(--good)}
.sync.warn i{background:var(--accent)}
nav.tabs{position:sticky;top:0;z-index:5;background:var(--nav-bg,var(--bg));-webkit-backdrop-filter:blur(8px);backdrop-filter:blur(8px);display:flex;gap:4px;padding:12px 0 10px;margin-bottom:6px;overflow-x:auto;scrollbar-width:none}
nav.tabs::-webkit-scrollbar{display:none}
nav.tabs button{flex:1 0 auto;min-width:0;font-family:var(--display);font-weight:700;font-size:20px;letter-spacing:.5px;text-transform:uppercase;background:transparent;color:var(--muted);border:0;border-bottom:3px solid var(--line);padding:8px 2px 6px;cursor:pointer;border-radius:0;min-height:40px}
nav.tabs button[aria-selected="true"]{color:var(--ink);border-bottom-color:var(--accent)}
.stack{display:flex;flex-direction:column;gap:12px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:16px}
.card h2,.card h3{margin:0;font-family:var(--display);font-weight:700;text-transform:uppercase;letter-spacing:.4px}
.card h2{font-size:26px}
.card h3{font-size:22px;line-height:1.1}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.between{justify-content:space-between}
label{font-size:13px;font-weight:600;color:var(--muted);display:block;margin-bottom:4px}
input,select{font:inherit;color:var(--ink);background:var(--bg);border:1px solid var(--line);border-radius:8px;padding:10px 12px;min-height:44px;width:100%}
input:focus-visible,select:focus-visible,button:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
button{font:inherit;cursor:pointer;border-radius:8px;min-height:44px;padding:8px 14px;border:1px solid var(--line);background:var(--surface);color:var(--ink);font-weight:600}
button:hover{border-color:var(--muted)}
button.primary{background:var(--accent);color:var(--accent-ink);border-color:var(--accent);font-family:var(--display);font-size:22px;letter-spacing:.6px;text-transform:uppercase;width:100%;min-height:54px}
button.primary:disabled{opacity:.45;cursor:not-allowed}
button.ghost{background:transparent;border-color:transparent;color:var(--muted);font-weight:500;padding:6px 8px;min-height:36px}
button.ghost:hover{color:var(--ink)}
button.danger-armed{background:var(--accent-soft);color:var(--accent);border-color:var(--accent)}
.muted{color:var(--muted)}
.small{font-size:13px}
.num{font-variant-numeric:tabular-nums}
.ex header{display:flex;justify-content:space-between;align-items:flex-start;gap:8px}
.last{margin:6px 0 12px;font-size:14px;color:var(--muted)}
.last b{color:var(--ink);font-weight:600}
.sets-head,.set{display:grid;grid-template-columns:28px 1fr 1fr 74px 36px;gap:8px;align-items:center}
.sets-head{font-size:12px;font-weight:600;color:var(--muted);text-transform:uppercase;letter-spacing:.4px;margin-bottom:6px}
.set{margin-bottom:6px}
.set .n{font-family:var(--display);font-weight:700;font-size:22px;color:var(--muted);text-align:center}
.set input{text-align:center;font-variant-numeric:tabular-nums;font-weight:600;font-size:18px;padding:8px 6px}
.badge{font-size:12px;font-weight:600;text-align:center;border-radius:999px;padding:3px 6px;white-space:nowrap}
.badge.pr{background:var(--good-soft);color:var(--good)}
.badge.e{color:var(--muted);font-weight:500}
.tiles{display:grid;grid-template-columns:repeat(2,1fr);gap:8px}
.tile{background:var(--bg);border-radius:calc(var(--r) * .8);padding:10px 12px}
.tile .k{font-size:12px;color:var(--muted);font-weight:600;text-transform:uppercase;letter-spacing:.3px}
.tile .v{font-family:var(--display);font-weight:800;font-size:34px;line-height:1.05;font-variant-numeric:tabular-nums}
.tile .v small{font-family:var(--body);font-size:14px;font-weight:500;color:var(--muted);margin-left:2px}
.tile .v.up{color:var(--good)}
.tile .v.down{color:var(--accent)}
svg.chart{width:100%;height:auto;display:block;margin-top:8px}
svg .grid{stroke:var(--line);stroke-width:1}
svg .axis{fill:var(--muted);font:12px var(--body);font-variant-numeric:tabular-nums}
svg .line{fill:none;stroke:var(--accent);stroke-width:2.5;stroke-linejoin:round;stroke-linecap:round}
svg .area{fill:var(--accent);opacity:.10}
svg .dot{fill:var(--surface);stroke:var(--accent);stroke-width:2}
svg .end{fill:var(--accent)}
svg .endlabel{fill:var(--ink);font:600 13px var(--body);font-variant-numeric:tabular-nums}
svg .bar{fill:var(--ink);opacity:.82}
svg .bar.cur{fill:var(--accent);opacity:1}
table{width:100%;border-collapse:collapse;font-size:14px;font-variant-numeric:tabular-nums}
th{text-align:left;font-size:12px;color:var(--muted);font-weight:600;text-transform:uppercase;letter-spacing:.3px;padding:6px 4px;border-bottom:1px solid var(--line)}
td{padding:8px 4px;border-bottom:1px solid var(--line)}
td.r,th.r{text-align:right}
.hist-item{display:flex;flex-direction:column;gap:8px}
.hist-item ul{margin:0;padding:0;list-style:none;display:flex;flex-direction:column;gap:2px;font-size:14px}
.hist-item li span{color:var(--muted)}
.banner{background:var(--accent-soft);color:var(--ink);border-radius:8px;padding:10px 12px;font-size:14px;display:flex;gap:8px;align-items:center;justify-content:space-between;flex-wrap:wrap}
.empty{text-align:center;padding:28px 16px}
.empty p{max-width:40ch;margin:6px auto 14px;color:var(--muted)}
.form-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;align-items:end}
@media (max-width:420px){
  h1{font-size:44px}
  nav.tabs button{font-size:14px;letter-spacing:0;padding-left:2px;padding-right:2px}
  .form-grid{grid-template-columns:1fr 1fr}
  .form-grid .full{grid-column:1/-1}
  .sets-head,.set{grid-template-columns:24px 1fr 1fr 62px 32px;gap:6px}
}
.cal-grid{display:grid;grid-template-columns:repeat(7,1fr);gap:4px;margin-top:12px}
.cal-grid .wd{font-size:12px;font-weight:600;color:var(--muted);text-align:center;text-transform:uppercase;letter-spacing:.3px;padding-bottom:2px}
.cal-day{aspect-ratio:1;min-height:0;padding:0;border:0;border-radius:8px;background:var(--bg);color:var(--ink);font-family:var(--display);font-weight:700;font-size:20px;font-variant-numeric:tabular-nums;display:flex;align-items:center;justify-content:center;position:relative}
.cal-day:hover{box-shadow:inset 0 0 0 1px var(--muted)}
.cal-day.has{background:var(--accent);color:var(--accent-ink)}
.cal-day.today{box-shadow:inset 0 0 0 2px var(--ink)}
.cal-day.sel{outline:3px solid var(--ink);outline-offset:1px}
.cal-day.future{color:var(--muted)}
.cal-day .bdot{position:absolute;bottom:5px;left:50%;width:5px;height:5px;margin-left:-2.5px;border-radius:50%;background:currentColor;opacity:.7}
.cal-head{display:flex;align-items:center;justify-content:space-between;gap:8px}
.cal-head h2{text-align:center;flex:1}
.cal-head button{font-family:var(--display);font-size:26px;line-height:1;width:44px;padding:0}
.cal-stats{display:flex;gap:8px;margin-top:12px}
.cal-stats .tile{flex:1}
.legend{display:flex;gap:14px;flex-wrap:wrap;margin-top:10px;font-size:12px;color:var(--muted)}
.legend span{display:inline-flex;align-items:center;gap:6px}
.legend i{width:12px;height:12px;border-radius:3px;display:inline-block}
.tag{display:inline-block;font-size:11px;font-weight:600;text-transform:uppercase;letter-spacing:.5px;color:var(--accent);margin-bottom:2px}
.target{margin:6px 0 0;font-size:14px}
.hint{margin:0 0 12px;font-size:14px;background:var(--good-soft);color:var(--ink);border-left:3px solid var(--good);padding:8px 10px;border-radius:6px}
.hint b{color:var(--good)}
.big-add{width:100%;min-height:52px;border:2px dashed var(--line);background:transparent;font-size:16px;color:var(--ink)}
.big-add:hover{border-color:var(--accent);color:var(--accent)}
.card .big-add{margin-top:4px}
.plan-cta{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap}
.day-list{display:flex;flex-direction:column;gap:8px;margin-top:12px}
.day-btn{display:grid;grid-template-columns:1fr auto;grid-template-areas:"n c" "m c";text-align:left;gap:2px 8px;padding:12px 14px;background:var(--bg);border:1px solid var(--line);min-height:60px}
.day-btn .dn{grid-area:n;font-family:var(--display);font-weight:700;font-size:21px;text-transform:uppercase;letter-spacing:.3px;line-height:1.1}
.day-btn .dm{grid-area:m;font-size:13px;color:var(--muted);font-weight:500}
.day-btn .chip{grid-area:c;align-self:center}
.day-btn.is-today{border:2px solid var(--accent);background:var(--accent-soft)}
.chip{display:inline-block;font-size:12px;font-weight:600;border-radius:999px;padding:3px 10px;background:var(--accent);color:var(--accent-ink);white-space:nowrap}
.chip.on{background:var(--good-soft);color:var(--good)}
.draft-title{display:flex;flex-direction:column;width:100%}
.draft-title b{font-family:var(--display);font-size:20px;text-transform:uppercase;line-height:1.1}
.section-h{font-family:var(--display);font-weight:700;text-transform:uppercase;letter-spacing:.4px;margin:8px 0 0;font-size:24px}
.plan-days{margin:8px 0 12px;padding:0;list-style:none;display:flex;flex-direction:column;gap:3px;font-size:14px}
.card.plan.is-active{border:2px solid var(--good)}
.wd-row{display:grid;grid-template-columns:repeat(7,1fr);gap:4px}
.wd-chip{min-height:40px;padding:0;font-size:14px;background:var(--bg)}
.wd-chip[aria-pressed="true"]{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.day-name{font-family:var(--display);font-weight:700;font-size:18px;text-transform:uppercase;letter-spacing:.3px}
@media (max-width:420px){
      .pe-name{grid-column:1/-1}
}
.cal-day.plan{border:2px dashed var(--accent)}
body.locked{overflow:hidden}
.sheet{position:fixed;inset:0;background:rgba(10,12,15,.5);z-index:30;display:flex;align-items:flex-end;justify-content:center}
.sheet[hidden]{display:none}
.sheet-panel{background:var(--surface);width:100%;max-width:600px;height:90%;border-radius:16px 16px 0 0;display:flex;flex-direction:column;gap:10px;padding:16px 16px 0;box-shadow:0 -8px 30px rgba(0,0,0,.25)}
.sheet-top{display:flex;align-items:center;justify-content:space-between;gap:8px}
.sheet-top h2{margin:0;font-family:var(--display);font-weight:800;font-size:26px;text-transform:uppercase;line-height:1}
.primary-sm{flex:none;white-space:nowrap;background:var(--accent);color:var(--accent-ink);border-color:var(--accent);font-family:var(--display);font-size:19px;letter-spacing:.4px;text-transform:uppercase;padding:6px 16px}
.chips{display:flex;gap:6px;overflow-x:auto;padding-bottom:4px;scrollbar-width:thin;flex:none}
.chip-btn{flex:none;border-radius:999px;min-height:38px;padding:6px 14px;font-size:14px;background:var(--bg)}
.chip-btn[aria-selected="true"]{background:var(--ink);color:var(--surface);border-color:var(--ink)}
.pk-list{list-style:none;margin:0;padding:0;overflow-y:auto;flex:1;border-top:1px solid var(--line)}
.pk-row{width:100%;display:flex;align-items:center;justify-content:space-between;gap:10px;text-align:left;background:transparent;border:0;border-bottom:1px solid var(--line);border-radius:0;padding:10px 4px;min-height:58px}
.pk-main{display:flex;flex-direction:column;gap:2px}
.pk-name{font-weight:600;font-size:16px}
.pk-sub{font-size:13px;color:var(--muted);font-weight:400}
.pk-mark{flex:none;width:34px;height:34px;border-radius:50%;border:2px solid var(--line);display:flex;align-items:center;justify-content:center;font-size:18px;font-weight:700;color:var(--muted)}
.pk-row.on .pk-mark{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.pk-row.on .pk-name{color:var(--accent)}
.pk-empty{padding:24px 8px;color:var(--muted);text-align:center}
.pk-foot{flex:none;padding:10px 0 16px;border-top:1px solid var(--line)}
.pk-foot summary{cursor:pointer;font-weight:600;font-size:14px;color:var(--muted);padding:6px 0}
.meas-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;align-items:end}
.meas-grid .full{grid-column:1/-1}
@media (max-width:420px){.meas-grid{grid-template-columns:1fr 1fr}}
h4.sub{font-family:var(--display);font-weight:700;font-size:19px;text-transform:uppercase;letter-spacing:.4px;margin:16px 0 8px}
.tips{margin-top:10px;font-size:14px}
.tips summary{cursor:pointer;font-weight:600;color:var(--muted);padding:4px 0}
.tips ul{margin:8px 0 0;padding-left:18px;display:flex;flex-direction:column;gap:6px}
.meas-table tr.on td{background:var(--bg)}
.meas-table tr.on td:first-child .link{color:var(--accent)}
button.link{background:none;border:0;padding:0;min-height:0;font:inherit;font-weight:600;color:var(--ink);text-decoration:underline;text-decoration-color:var(--line);text-underline-offset:3px;cursor:pointer}
.body-hist{list-style:none;margin:8px 0 0;padding:0;display:flex;flex-direction:column}
.body-hist li{padding:10px 0;border-top:1px solid var(--line)}
.body-hist .vals{display:flex;flex-wrap:wrap;gap:4px 14px;font-size:14px;color:var(--muted);margin-top:4px}
.body-hist .vals b{color:var(--ink)}
.brand-r{display:flex;align-items:center;gap:8px}
.gear{width:44px;height:44px;padding:0;display:flex;align-items:center;justify-content:center;border-radius:50%;color:var(--muted)}
.gear[aria-pressed="true"]{background:var(--ink);color:var(--surface);border-color:var(--ink)}
.lastbox{display:flex;justify-content:space-between;align-items:flex-end;gap:12px;background:var(--bg);border-left:3px solid var(--accent);border-radius:6px;padding:8px 12px;margin:8px 0 12px}
.lb-k{display:block;font-size:11px;font-weight:600;text-transform:uppercase;letter-spacing:.4px;color:var(--muted)}
.lb-big{font-family:var(--display);font-weight:800;font-size:26px;line-height:1.05}
.lb-reps{font-size:15px;font-weight:600}
.lb-rec{text-align:right;font-size:14px;font-weight:600}
.hint.warn{background:var(--accent-soft);border-left-color:var(--accent)}
.mgrid{display:grid;grid-template-columns:1fr;gap:10px;margin-top:12px}
@media (min-width:560px){.mgrid{grid-template-columns:1fr 1fr}}
.mcard{background:var(--bg);border-radius:calc(var(--r) * .8);padding:10px 12px 6px}
.mhead{display:flex;justify-content:space-between;align-items:flex-start;gap:8px}
.mk{display:block;font-size:12px;font-weight:600;text-transform:uppercase;letter-spacing:.3px;color:var(--muted)}
.mv{font-family:var(--display);font-weight:800;font-size:30px;line-height:1.05}
.mv small{font-family:var(--body);font-size:13px;font-weight:500;color:var(--muted);margin-left:3px}
.mchg{text-align:right;font-size:13px;display:flex;flex-direction:column}
.mchg b{font-size:15px}
.mchg span{color:var(--muted)}
.seg{display:inline-flex;flex-wrap:wrap;gap:4px;background:var(--bg);border-radius:10px;padding:3px}
.seg button{min-height:38px;border:0;background:transparent;padding:6px 12px;font-weight:600;color:var(--muted)}
.seg button[aria-pressed="true"]{background:var(--surface);color:var(--ink);box-shadow:0 1px 3px rgba(0,0,0,.15)}
.set-row{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:10px 0;border-top:1px solid var(--line);flex-wrap:wrap}
.card h2+.set-row,.card h3+.set-row{margin-top:10px}
.set-row.col{flex-direction:column;align-items:flex-start}
.set-l{font-weight:600}
.pe-ex{border-top:1px solid var(--line)}
.pe-ex:last-child{border-bottom:1px solid var(--line)}
.pe-items{margin:12px 0 10px}
.pe-ex-head{display:grid;grid-template-columns:1fr 34px 34px;gap:4px;align-items:center}
.pe-ex-head .ghost{padding:0;min-height:34px}
.pe-ex-head .ghost:disabled{opacity:.3}
.pe-toggle{display:flex;justify-content:space-between;align-items:center;gap:8px;text-align:left;background:transparent;border:0;padding:10px 2px;min-height:52px;border-radius:0;font-weight:400}
.pe-toggle .chev{color:var(--muted);transition:transform .15s}
.pe-ex.open .chev{transform:rotate(180deg)}
.pe-name{font-size:15px;font-weight:600;line-height:1.25}
.pe-name small{display:block;font-size:13px;color:var(--muted);font-weight:400;margin-top:2px}
.pe-body{padding:2px 0 14px}
.pe-set-head,.pe-set{display:grid;grid-template-columns:28px 1fr 14px 1fr 34px;gap:6px;align-items:center}
.pe-set-head{font-size:12px;font-weight:600;color:var(--muted);text-transform:uppercase;letter-spacing:.3px;margin-bottom:4px}
.pe-set{margin-bottom:6px}
.pe-set .n{font-family:var(--display);font-weight:700;font-size:20px;color:var(--muted);text-align:center}
.pe-set input{text-align:center;font-weight:600;font-variant-numeric:tabular-nums;padding:6px 4px;min-height:42px}
.pe-set .x{color:var(--muted);text-align:center}
.pe-set .ghost{padding:0;min-height:34px}
.small-btn{min-height:38px;font-size:14px}
.pe-target{margin-top:12px;max-width:220px}
.pe-auto{font-size:13px;color:var(--muted);margin:10px 0 0}
.pe-hist{margin-top:10px;background:var(--bg);border-radius:6px;padding:8px 10px}
.pe-hist ul{list-style:none;margin:4px 0 0;padding:0;font-size:14px;display:flex;flex-direction:column;gap:2px}
.timer{position:fixed;left:0;right:0;bottom:0;z-index:25;background:var(--surface);border-top:1px solid var(--line);box-shadow:0 -4px 18px rgba(0,0,0,.12)}
.timer[hidden]{display:none}

function exStats(workouts,name,excludeId){
  const out=[];
  for(const w of workouts){
    if(excludeId&&w.id===excludeId)continue;
    for(const ex of (w.exercises||[])){
      if(ex.name!==name)continue;
      const sets=validSets(ex.sets); if(!sets.length)continue;
      let e=0,tw=0,mr=0,vol=0,best=sets[0];
      for(const s of sets){const v=e1rm(s.w,s.r);if(v>e||(v===e&&s.r>best.r)){e=v;best=s}tw=Math.max(tw,s.w);mr=Math.max(mr,s.r);vol+=s.w*s.r}
      out.push({id:w.id,date:w.date,e1:e,topW:tw,maxR:mr,vol,sets,best});

  out.sort((a,b)=>a.date<b.date?-1:a.date>b.date?1:0);
  return out;
}

const SYNC={local:['sync_local','','sync_local_t'],connecting:['sync_connecting','',''],cloud:['sync_cloud','ok','sync_cloud_t'],slow:['sync_slow','warn','sync_slow_t'],error:['sync_error','warn','sync_error_t']};

function setSync(k){syncKey=k;const el=$('#sync');
  if(typeof gOn==='function'&&gOn()){const ok=gState==='ok'||gState==='';el.className='sync '+(ok?'ok':gState==='syncing'?'':'warn')+' tappable';el.title=gStatusTxt();el.querySelector('span').textContent=gState==='syncing'?t('g_syncing'):gState==='needtap'?t('g_needtap'):gState==='offline'||gState==='error'?gStatusTxt():t('g_chip')+' ✓';return}

function toDoc(kind,o){
  if(kind==='workouts')return{type:'workout',date:o.date,title:o.title||'',planId:o.planId||null,dayId:o.dayId||null,duration:o.duration||0,exercises:o.exercises};
  if(kind==='plans')return{type:'plan',name:o.name,active:!!o.active,days:o.days};
  if(kind==='habits')return{type:'habit',name:o.name,icon:o.icon||'',start:o.start,cost:o.cost||0,cur:o.cur||'',best:o.best||0,attempts:o.attempts||[]};
  return{type:'body',date:o.date,weight:o.weight==null?null:o.weight,m:o.m||{}};
}
function goLocal(){if(unsub){try{unsub()}catch(e){}unsub=null}backend='local';setSync('error');persistLocal()}
async function saveDoc(kind,o,noRender){
  if(backend==='cloud'){try{await col.doc(o.id).set(toDoc(kind,o));return}catch(e){goLocal()}}
  o.u=Date.now();
  const arr=state[kind];const i=arr.findIndex(x=>x.id===o.id);
  if(i>=0)arr[i]=o;else arr.push(o);

}

  state.metaU=Date.now();persistLocal();gSchedule();
}
async function initCloud(){
  const c=window.claude;
  if(!c||typeof c.use!=='function'){setSync('local');return}
  setSync('connecting');
  let db,user;
  try{[db,user]=await Promise.all([c.use('db'),c.use('user')])}catch(e){db=null}
  if(!db||!user){setSync('local');return}
  let id=null;try{id=await user.id()}catch(e){}
  if(!id){setSync('local');return}
  col=db.collection('data/users/'+id);
  let confirmed=false,migrated=false;
  const timer=setTimeout(()=>{if(!confirmed)setSync('slow')},10000);
  unsub=col.onSnapshot(snap=>{
    if(snap.metadata.fromCache&&snap.empty)return;
    if(!snap.metadata.fromCache&&!confirmed){
      confirmed=true;clearTimeout(timer);
      if(!migrated){
        migrated=true;
        const loc=normalize(lsGet(LS_DATA));
        if(snap.empty&&(loc.habits.length||loc.favs.length||loc.workouts.length||loc.body.length||loc.custom.length||loc.plans.length)){backend='cloud';setSync('cloud');migrateUp(loc);return}
      }
    }
    const s={workouts:[],body:[],custom:[],plans:[],favs:[],habits:[]};
    snap.docs.forEach(d=>{const v=d.data();if(!v)return;
      if(v.type==='workout')s.workouts.push({id:d.id,date:v.date,title:v.title||'',planId:v.planId||null,dayId:v.dayId||null,duration:v.duration||0,exercises:v.exercises||[]});
      else if(v.type==='body')s.body.push({id:d.id,date:v.date,weight:v.weight,m:v.m||(v.waist>0?{talia:v.waist}:{})});
      else if(v.type==='habit')s.habits.push({id:d.id,name:v.name,icon:v.icon,start:v.start,cost:v.cost,cur:v.cur,best:v.best,attempts:v.attempts||[]});
      else if(v.type==='plan')s.plans.push({id:d.id,name:v.name,active:!!v.active,days:v.days||[]});
      else if(d.id==='settings'){s.custom=Array.isArray(v.custom)?v.custom.slice():[];s.favs=Array.isArray(v.favs)?v.favs.slice():[]}
    });
    state=normalize(s);persistLocal();
    if(confirmed){backend='cloud';setSync('cloud')}
    render();
  },err=>{clearTimeout(timer);unsub=null;backend='local';setSync('error')});
}
async function migrateUp(loc){
  try{
    for(const w of loc.workouts)await col.doc(w.id).set(toDoc('workouts',w));
    for(const b of loc.body)await col.doc(b.id).set(toDoc('body',b));
    for(const p of loc.plans)await col.doc(p.id).set(toDoc('plans',p));
    for(const h of loc.habits)await col.doc(h.id).set(toDoc('habits',h));
    if(loc.custom.length||loc.favs.length)await col.doc('settings').set({type:'settings',custom:loc.custom,favs:loc.favs});
  }catch(e){goLocal()}
}

/* ---------- wykresy ---------- */
function niceTicks(min,max,count){
  count=count||4;if(min===max){min-=1;max+=1}
  const step0=(max-min)/count,mag=Math.pow(10,Math.floor(Math.log10(step0))),n=step0/mag;
  const step=(n<1.5?1:n<3?2:n<7?5:10)*mag;
  const lo=Math.floor(min/step)*step,hi=Math.ceil(max/step)*step,tk=[];
  for(let v=lo;v<=hi+step/2;v+=step)tk.push(+v.toFixed(6));
  return{lo,hi,ticks:tk};
}
function lineChart(pts,unit,label,small){
  if(pts.length<2)return '<p class="muted small">'+t('need_two')+'</p>';
  const W=400,H=small?140:200,L0=44,R=14,T=small?20:24,B=26;
  const xs=pts.map(p=>parseD(p.date).getTime()),x0=Math.min(...xs),x1=Math.max(...xs);
  const ys=pts.map(p=>p.y),tk=niceTicks(Math.min(...ys),Math.max(...ys),small?2:4);
  const X=v=>L0+(x1===x0?.5:(v-x0)/(x1-x0))*(W-L0-R),Y=v=>T+(1-(v-tk.lo)/(tk.hi-tk.lo))*(H-T-B);
  const g=tk.ticks.map(v=>`<line class="grid" x1="${L0}" x2="${W-R}" y1="${Y(v).toFixed(1)}" y2="${Y(v).toFixed(1)}"/><text class="axis" x="${L0-8}" y="${(Y(v)+4).toFixed(1)}" text-anchor="end">${fmt(v,1)}</text>`).join('');
  const path=pts.map((p,i)=>(i?'L':'M')+X(xs[i]).toFixed(1)+' '+Y(p.y).toFixed(1)).join(' ');
  const area=path+` L${X(xs[xs.length-1]).toFixed(1)} ${H-B} L${X(xs[0]).toFixed(1)} ${H-B} Z`;
  const dots=pts.slice(0,-1).map((p,i)=>`<circle class="dot" cx="${X(xs[i]).toFixed(1)}" cy="${Y(p.y).toFixed(1)}" r="3.5"><title>${dShort(p.date)}: ${fmt(p.y)} ${unit}</title></circle>`).join('');
  const li=pts.length-1,ex=X(xs[li]),ey=Y(pts[li].y),ly=ey-T<14?ey+20:ey-11;
  const xl=[0,Math.floor(li/2),li].filter((v,i,a)=>a.indexOf(v)===i).map(i=>`<text class="axis" x="${X(xs[i]).toFixed(1)}" y="${H-7}" text-anchor="${i===0?'start':i===li?'end':'middle'}">${dShort(pts[i].date)}</text>`).join('');
  return `<svg class="chart" viewBox="0 0 ${W} ${H}" role="img" aria-label="${esc(label)}">${g}<path class="area" d="${area}"/><path class="line" d="${path}"/>${dots}<circle class="end" cx="${ex.toFixed(1)}" cy="${ey.toFixed(1)}" r="5.5"/><text class="endlabel" x="${(ex-8).toFixed(1)}" y="${ly.toFixed(1)}" text-anchor="end">${fmt(pts[li].y)} ${unit}</text>${xl}</svg>`;
}
function barChart(bars,label){
  const W=400,H=170,L0=46,R=6,T=14,B=28;
  const mx=Math.max(1,...bars.map(b=>b.v)),tk=niceTicks(0,mx,3);
  const bw=(W-L0-R)/bars.length,Y=v=>T+(1-v/tk.hi)*(H-T-B);
  const k=wU()==='kg'?' t':'k';
  const g=tk.ticks.map(v=>`<line class="grid" x1="${L0}" x2="${W-R}" y1="${Y(v).toFixed(1)}" y2="${Y(v).toFixed(1)}"/><text class="axis" x="${L0-8}" y="${(Y(v)+4).toFixed(1)}" text-anchor="end">${v>=1000?fmt(v/1000,1)+k:fmt(v,0)}</text>`).join('');
  const r=bars.map((b,i)=>{const x=L0+i*bw+bw*.18,w=bw*.64,y=Y(b.v);return `<rect class="bar${i===bars.length-1?' cur':''}" x="${x.toFixed(1)}" y="${y.toFixed(1)}" width="${w.toFixed(1)}" height="${Math.max(0,H-B-y).toFixed(1)}" rx="2"><title>${t('week_of',b.label)}: ${fmt(b.v,0)} ${wU()}</title></rect><text class="axis" x="${(x+w/2).toFixed(1)}" y="${H-8}" text-anchor="middle">${b.label}</text>`}).join('');
  return `<svg class="chart" viewBox="0 0 ${W} ${H}" role="img" aria-label="${esc(label)}">${g}${r}</svg>`;

function lastSession(name){
  const st=exStats(state.workouts,name,draft.id).filter(s=>s.date<=draft.date);
  return st.length?st[st.length-1]:null;
}
function upperReps(r){const m=String(r||'').match(/\d+/g);return m?+m[m.length-1]:0}
function hintFor(ex){
  if(!ex.target)return '';
  const l=lastSession(ex.name);if(!l)return '';
  const up=upperReps(ex.target.reps);if(!up)return '';
  const done=l.sets.length>=ex.target.sets&&l.sets.slice(0,ex.target.sets).every(s=>s.r>=up);
  if(!done)return '';
  return l.topW>0?`<p class="hint">${t('hint_up',fmt(toW(l.topW)+wStep(),wDec())+' '+wU())}</p>`:`<p class="hint">${t('hint_bw')}</p>`;
}
function lastBox(name){
  const st=exStats(state.workouts,name,draft.id).filter(s=>s.date<=draft.date);
  if(!st.length)return `<p class="last">${t('first_time')}</p>`;
  const l=st[st.length-1],b=bestEver(st);
  const main=l.topW>0?`<b class="lb-big num">${fWu(l.topW)}</b>`:`<b class="lb-big num">${l.maxR} ${t('reps_ph')}</b>`;
  const reps=l.topW>0?l.sets.map(s=>s.w===l.topW?String(s.r):fW(s.w)+'×'+s.r).join(', '):'';
  return `<div class="lastbox">
    <div><span class="lb-k">${t('last_time')} · ${dShort(l.date)}</span><div>${main}${reps?` <span class="num lb-reps">× ${reps}</span>`:''}</div></div>
    ${b&&st.length>1?`<div class="lb-rec"><span class="lb-k">${t('record')}</span><span class="num">${setTxt(b.best)}</span></div>`:''}

}

function updateBadges(ei){

  const bestE=st.length?Math.max(...st.map(s=>s.e1)):0,bestR=st.length?Math.max(...st.map(s=>s.maxR)):0;

let mmRange='this';
function setsByGroup(ws,from,to){
  const g={};
  ws.forEach(w=>{if(w.date<from||w.date>to)return;(w.exercises||[]).forEach(e=>{
    const n=validSets(e.sets).length;if(!n)return;
    const info=exInfo(e.name);const gs=info.groups||[info.group];
    gs.forEach(gr=>{if(gr==='moje')return;if(gr==='cale'){['nogi','plecy','barki','posladki'].forEach(x=>g[x]=(g[x]||0)+n*0.5);return}g[gr]=(g[gr]||0)+n});
  })});
  return g;
}
function mmLevel(n){return n<=0?0:n<4?1:n<8?2:n<12?3:4}
function muscleMapCard(data){
  const ws=weekStart(today());const d=parseD(ws);
  let from=ws,to=today(),div=1;
  if(mmRange==='prev'){const a=new Date(d);a.setDate(a.getDate()-7);const b=new Date(d);b.setDate(b.getDate()-1);from=ymd(a);to=ymd(b)}
  else if(mmRange==='4w'){const a=new Date(d);a.setDate(a.getDate()-21);from=ymd(a);div=4}
  const raw=setsByGroup(data.workouts,from,to),cnt={},lv={};
  const main=GROUPS.map(g=>g[0]).filter(g=>g!=='moje'&&g!=='cale');
  main.forEach(g=>{cnt[g]=(raw[g]||0)/div;lv[g]=mmLevel(cnt[g])});
  const any=main.some(g=>cnt[g]>0);
  const max=Math.max(12,...main.map(g=>cnt[g]));
  const rows=main.slice().sort((a,b)=>cnt[b]-cnt[a]).map(g=>`<div class="mm-row"><span class="mm-n">${esc(gName(g))}</span><span class="mm-bar"><i class="h${lv[g]}" style="width:${(cnt[g]/max*100).toFixed(0)}%"></i></span><span class="mm-c num">${fmt(cnt[g],div>1?1:0)}</span></div>`).join('');
  const low=main.filter(g=>cnt[g]<4).map(gName);
  const rb=(k,l)=>`<button data-action="mm-range" data-v="${k}" aria-pressed="${mmRange===k}">${t(l)}</button>`;
  return `<section class="card">
    <h3>${t('mm_h')}</h3>
    <p class="small muted" style="margin:4px 0 10px">${t('mm_p')}</p>
    <div class="seg mm-seg" role="group">${rb('this','mm_this')}${rb('prev','mm_prev')}${rb('4w','mm_4w')}</div>
    <div class="mm-fig">${bodyFig([],'big',{heat:lv})}</div>
    <div class="mm-legend"><span class="small muted">${t('mm_legend')}:</span>${['0','1–3','4–7','8–11','12+'].map((x,i)=>`<span><i class="h${i}"></i>${x}</span>`).join('')}</div>
    ${any?`<div class="mm-list">${rows}</div>${low.length?`<p class="hint warn" style="margin-top:10px">${t('mm_low',low.join(', '))}</p>`:''}`:`<p class="small muted">${t('mm_none')}</p>`}
    <p class="small muted" style="margin:8px 0 0">${t('mm_note')}</p>

function weekStreak(){

}
function calendarCard(){
  const [y,m]=calMonth.split('-').map(Number);

function latestWeight(){const l=state.body.filter(b=>b.weight>0).sort((a,b)=>a.date<b.date?-1:1).pop();return l?l.weight:null}
function calcResult(){
  const c=prefs.calc;
  const age=num(c.age),h=fromL(num(c.height)),wIn=num(c.weight),lw=latestWeight();
  const w=wIn>0?fromW(wIn):lw;
  if(!(age>=14&&age<=100)||!(h>=120&&h<=230)||!(w>=30&&w<=300))return null;
  let bmr;
  if(c.formula==='hb')bmr=c.sex==='f'?655.1+9.563*w+1.85*h-4.676*age:66.5+13.75*w+5.003*h-6.75*age;
  else bmr=10*w+6.25*h-5*age+(c.sex==='f'?-161:5);
  const tdee=bmr*(+c.pal||1.55),target=tdee*(1+(+c.goal||0));
  const pLo=1.6*w,pHi=2*w,f=target*0.25/9,cbHi=Math.max(0,(target-pLo*4-f*9)/4),cbLo=Math.max(0,(target-pHi*4-f*9)/4);
  return{bmr,tdee,target,pLo,pHi,f,cbLo,cbHi,fromBody:!(wIn>0)&&!!lw};
}
function calcOut(){

const HB_PRESETS=[['alk','🍺',['Bez alkoholu','No alcohol']],['papierosy','🚬',['Bez papierosów','No cigarettes']],['fastfood','🍔',['Bez fast foodu','No fast food']],['slodycze','🍫',['Bez słodyczy','No sweets']],['napoje','🥤',['Bez słodkich napojów','No sugary drinks']],['energetyki','⚡',['Bez energetyków','No energy drinks']],['social','📱',['Mniej scrollowania','Less scrolling']],['hazard','🎰',['Bez hazardu','No gambling']]];
const HB_ICONS=['🚫','🍺','🚬','🍔','🍫','🥤','⚡','📱','🎮','☕','🍕','🎰','💪','🌙','💧','🧘'];
const HB_STEPS=[1,3,7,14,30,60,90,180,365,730];
const HB_LBL=[['1 dzień','3 dni','1 tydzień','2 tygodnie','1 miesiąc','2 miesiące','3 miesiące','pół roku','1 rok','2 lata'],['1 day','3 days','1 week','2 weeks','1 month','2 months','3 months','6 months','1 year','2 years']];
let hbForm=null;
const DAY=86400000;
function hbElapsed(h){return Math.max(0,Date.now()-new Date(h.start).getTime())}
function hbBest(h){return Math.max(h.best||0,hbElapsed(h))}
function dtLocal(d){return d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate())+'T'+pad(d.getHours())+':'+pad(d.getMinutes())}
function dtShow(iso){const d=new Date(iso);return dShort(ymd(d))+(L()?' '+d.getFullYear():'.'+d.getFullYear())+', '+pad(d.getHours())+':'+pad(d.getMinutes())}
function durTxt(ms){const d=Math.floor(ms/DAY),h=Math.floor(ms%DAY/3600000),m=Math.floor(ms%3600000/60000);
  if(d>0)return d+' '+plu(d,'day')+(h?' '+h+' '+t('h_short'):'');
  if(h>0)return h+' '+t('h_short')+' '+m+' '+t('min_short');
  return m+' '+t('min_short');}
function habitCard(h){
  const ms=hbElapsed(h),days=ms/DAY,dInt=Math.floor(days);
  const ni=HB_STEPS.findIndex(s=>days<s);
  const prev=ni<=0?0:HB_STEPS[ni-1],next=ni<0?null:HB_STEPS[ni];
  const pct=next?Math.min(100,(days-prev)/(next-prev)*100):100;
  const left=next?(next*DAY-ms):0;
  const badges=HB_STEPS.map((s,i)=>`<span class="hb-badge${days>=s?' on':''}" title="${HB_LBL[L()][i]}">${HB_LBL[L()][i]}</span>`).join('');
  const saved=h.cost>0?h.cost*days:0;
  const big=dInt>=1?`<span class="hb-num num">${dInt}</span><span class="hb-unit">${plu(dInt,'day')}</span><span class="hb-sub num">${Math.floor(ms%DAY/3600000)} ${t('h_short')} ${Math.floor(ms%3600000/60000)} ${t('min_short')}</span>`
    :`<span class="hb-num num">${Math.floor(ms/3600000)}</span><span class="hb-unit">${t('h_short')}</span><span class="hb-sub num">${Math.floor(ms%3600000/60000)} ${t('min_short')}</span>`;
  const best=hbBest(h);
  return `<article class="card habit">
    <div class="hb-head">
      <span class="hb-ico" aria-hidden="true">${esc(h.icon||'🚫')}</span>

}

const timerEl=$('#timer');
let timer={state:'idle',dur:+prefs.rest||180,end:0,left:0};
let tickH=null,audioCtx=null,doneT=null;
function remaining(){return timer.state==='run'?(timer.end-Date.now())/1000:timer.state==='pause'?timer.left:timer.dur}
function stopRest(){clearInterval(tickH);clearTimeout(doneT);if(timer.state!=='idle'&&timer.state!=='custom')ntCall('stopRest');timer.state='idle'}
function restUI(){
  const st=timer.state;
  if(st==='custom'){
    const m=Math.floor(timer.dur/60),sc=timer.dur%60;
    return `<div class="tb-row tb-cust"><span class="tb-ico" aria-hidden="true">⏱</span>

      <button class="tb-start" data-action="tm-custom-ok">${t('tm_set')}</button><button class="ghost" data-action="tm-custom-x" aria-label="${t('cancel')}">✕</button></div>`;
  }

      <div class="tb-presets" role="group" aria-label="${t('rest_len')}">${[...new Set([60,90,120,180,240].concat(prefs.restCustom>0?[prefs.restCustom]:[]))].sort((a,b)=>a-b).map(s=>`<button class="tb-chip" data-action="tm-set" data-s="${s}" aria-pressed="${timer.dur===s}">${fmtTime(s)}</button>`).join('')}<button class="tb-chip tb-custom" data-action="tm-custom">${t('tm_custom')}…</button></div>
      <button class="tb-start" data-action="tm-start">${t('rest')} ${fmtTime(timer.dur)} ▶</button></div>`;
  if(st==='done')return `<div class="tb-row tb-donerow"><span class="tb-go">${t('go')}</span><button class="tb-start" data-action="tm-ok">${t('ok')}</button></div>`;
  return `<div class="tb-prog"><i id="tb-bar"></i></div><div class="tb-row">
      <span class="tb-lbl">${t('rest')}</span><span class="tb-time num" id="tb-time" role="timer" aria-live="off">${fmtTime(remaining())}</span>
      <div class="tb-ctrl"><button data-action="tm-minus" aria-label="${t('minus15')}">−15</button><button data-action="tm-toggle" aria-label="${st==='pause'?t('resume'):t('pause')}">${st==='pause'?'▶':'❚❚'}</button><button data-action="tm-plus" aria-label="${t('plus15')}">+15</button><button data-action="tm-stop" aria-label="${t('stop')}">✕</button></div></div>`;
}
function renderTimer(){
  const live=isLive(),full=live&&tab==='trening'&&!sessionMin;
  const restOn=timer.state==='run'||timer.state==='pause'||timer.state==='done';
  const mini=live&&!full,bottom=!live&&restOn;
  document.body.classList.toggle('in-session',full);
  document.body.classList.toggle('has-timer',mini||bottom);
  if(!live&&!restOn){timerEl.hidden=true;timerEl.innerHTML='';return}
  timerEl.hidden=false;
  const stc=' st-'+timer.state+(timer.state==='pause'?' paused run':timer.state==='run'?' run':timer.state==='done'?' done':'');
  if(full){
    timerEl.className='timer sess'+stc;

  }else if(mini){

  }else{
    timerEl.className='timer'+stc;
    timerEl.innerHTML=restUI();
  }

function tick(){
  if(timer.state!=='run'&&timer.state!=='pause')return;
  const r=remaining();
  if(timer.state==='run'&&r<=0){finishTimer();return}
  const tEl=$('#tb-time'),bar=$('#tb-bar');
  if(tEl)tEl.textContent=fmtTime(r);
  if(bar)bar.style.width=Math.max(0,Math.min(100,100*(1-r/timer.total)))+'%';
}
function startTimer(sec){
  sec=sec||timer.dur;timer.total=sec;timer.end=Date.now()+sec*1000;timer.state='run';
  try{if(!audioCtx){const AC=window.AudioContext||window.webkitAudioContext;if(AC)audioCtx=new AC()}if(audioCtx&&audioCtx.state==='suspended')audioCtx.resume()}catch(e){}
  clearInterval(tickH);tickH=setInterval(tick,250);clearTimeout(doneT);
  if(isLive())ntCall('startRest',{endAt:timer.end,text:ntNext()});
  renderTimer();
}
function beep(){
  if(!prefs.sound||!audioCtx)return;
  try{
    const now=audioCtx.currentTime;
    [0,0.3,0.6].forEach(o=>{const osc=audioCtx.createOscillator(),g=audioCtx.createGain();osc.type='sine';osc.frequency.value=880;g.gain.setValueAtTime(0.0001,now+o);g.gain.exponentialRampToValueAtTime(0.4,now+o+0.02);g.gain.exponentialRampToValueAtTime(0.0001,now+o+0.22);osc.connect(g).connect(audioCtx.destination);osc.start(now+o);osc.stop(now+o+0.25)});
  }catch(e){}
}
function finishTimer(){
  clearInterval(tickH);timer.state='done';ntCall('stopRest');
  beep();
  if(prefs.vib&&navigator.vibrate){try{navigator.vibrate([300,150,300,150,300])}catch(e){}}
  toast(t('rest_over'));
  renderTimer();
  doneT=setTimeout(()=>{if(timer.state==='done'){timer.state='idle';renderTimer()}},8000);
}
document.addEventListener('visibilitychange',()=>{
  wakeSync();
  if(document.hidden)return;
  if(RT&&timer.state==='run'){
    if(remaining()<=0){stopRest();renderTimer();return}
    try{RT.getState().then(st=>{if(st&&st.skipped&&timer.state==='run'){clearInterval(tickH);timer.state='idle';renderTimer()}}).catch(()=>{})}catch(e){}
  }
  tick();
});
timerEl.addEventListener('keydown',e=>{if(e.key==='Enter'&&timer.state==='custom'){e.preventDefault();const b=timerEl.querySelector('[data-action="tm-custom-ok"]');if(b)b.click()}});
timerEl.addEventListener('click',e=>{
  const b=e.target.closest('[data-action]');if(!b)return;
  const a=b.dataset.action;
  if(a==='ss-min'){sessionMin=true;render();return}
  if(a==='ss-back'){sessionMin=false;setTab('trening');return}

    const m=parseInt($('#tm-m').value,10)||0,sc=parseInt($('#tm-s').value,10)||0,tot=m*60+sc;

    if(timer.state==='run'){timer.left=remaining();timer.state='pause';clearInterval(tickH);ntCall('stopRest')}
    else{timer.end=Date.now()+timer.left*1000;timer.state='run';clearInterval(tickH);tickH=setInterval(tick,250);if(isLive())ntCall('startRest',{endAt:timer.end,text:ntNext()})}
    renderTimer();
  }
  else if(a==='tm-minus'||a==='tm-plus'){
    const d=a==='tm-plus'?15:-15;
    if(timer.state==='run'){timer.end+=d*1000;timer.total=Math.max(timer.total+(d>0?d:0),1);if(isLive())ntCall('startRest',{endAt:timer.end,text:ntNext()})}
    else{timer.left=Math.max(0,timer.left+d);if(d>0)timer.total+=d}
    tick();
  }
  else if(a==='tm-stop'||a==='tm-ok'){stopRest();renderTimer()}
});

function pickExercise(name){
  const tg=picker.target;
  if(tg.kind==='swap'){
    const old=draft.exercises[tg.ei];if(!old){closePicker();return}
    if(old.name!==name){
      convertDraft();
      const l=exStats(state.workouts,name,draft.id).filter(x=>x.date<=draft.date).pop();
      const w=l?(l.topW>0?fWin(l.topW):'0'):'';
      draft.exercises[tg.ei]={name,target:old.target||null,sets:old.sets.map(x=>({w,r:x.done?'':x.r,done:false}))};
      persistDraft();toast(t('swapped',exName(name)));
    }
    closePicker();return;
  }
  if(tg.kind==='plan'){
    const d=planDraft.days[tg.di];if(!d)return;
    const i=d.items.findIndex(x=>x.name===name);
    if(i>=0)d.items.splice(i,1);else{const l=exStats(state.workouts,name).pop();d.items.push({name,reps:'',lastDate:null,sets:l?l.sets.map(x=>({w:x.w,r:x.r})):[0,1,2].map(()=>({w:null,r:null}))})}
  }else{
    const i=draft.exercises.findIndex(e=>e.name===name);
    if(i>=0){
      const ex=draft.exercises[i];
      if(ex.sets.some(s=>String(s.r).trim()!=='')){toast(t('already_sets'));return}
      draft.exercises.splice(i,1);
    }else addToDraft(name,null);
    persistDraft();
  }
  renderPicker();
}
function addToDraft(name,target,planSets){
  convertDraft();
  if(planSets&&planSets.some(x=>x.w!=null||x.r!=null)){
    draft.exercises.push({name,target:target||null,sets:planSets.map(x=>({w:x.w!=null?(x.w>0?fWin(x.w):'0'):'',r:x.r!=null?String(x.r):''}))});
    return;
  }
  const l=exStats(state.workouts,name,draft.id).filter(s=>s.date<=draft.date).pop();
  let sets;
  if(target){
    const w=l?(l.topW>0?fWin(l.topW):'0'):'';
    sets=Array.from({length:Math.max(1,Math.min(10,+target.sets||3))},()=>({w,r:''}));
  }else sets=l?l.sets.map(s=>({w:s.w>0?fWin(s.w):'0',r:String(s.r)})):[{w:'',r:''}];
  draft.exercises.push({name,target:target||null,sets});
}

async function saveWorkout(){
  const anyDone=isLive()&&draft.exercises.some(e=>e.sets.some(x=>x.done));
  const exercises=draft.exercises.map(e=>({name:e.name,sets:e.sets.filter(x=>!anyDone||x.done).map(s=>({w:draftKg(s.w),r:Math.round(num(s.r))})).filter(s=>s.r>0&&s.w>=0).map(s=>({w:Math.round(s.w*1000)/1000,r:s.r}))})).filter(e=>e.sets.length);
  if(!exercises.length){toast(t('need_set'));return}
  const prs=[];
  for(const ex of exercises){
    const st=exStats(state.workouts,ex.name,draft.id);if(!st.length)continue;
    const bestE=Math.max(...st.map(s=>s.e1)),bestR=Math.max(...st.map(s=>s.maxR));
    const myE=Math.max(...ex.sets.map(s=>e1rm(s.w,s.r))),myR=Math.max(...ex.sets.map(s=>s.r));
    if(bestE>0?myE>bestE+0.01:(myE===0&&myR>bestR))prs.push(exName(ex.name));
  }
  const man=parseInt(draft.durMin,10);
  const live=isLive();
  const duration=live?Math.max(1,Math.round(wkElapsed()/60000)):(man>0&&man<600?man:(draft.id&&draft.prevDur?draft.prevDur:0));
  const w={id:draft.id||genId('w-'),date:draft.date||today(),title:draft.title||'',planId:draft.planId||null,dayId:draft.dayId||null,duration:duration||0,exercises};
  const editing=!!draft.id;
  if(live){ntCall('stopWorkout');let sets=0,vol=0;exercises.forEach(e=>e.sets.forEach(x=>{sets++;vol+=x.w*x.r}));lastSummary={title:draft.title||t('free_title'),dur:duration,sets,vol,prs:prs.slice()};stopRest()}
  draft=newDraft();persistDraft();
  await saveDoc('workouts',w,true);
  const upd=await updatePlanFromWorkout(w);
  render();window.scrollTo(0,0);
  const msg=prs.length?t('saved_pr',prs.join(', ')):editing?t('saved_edit'):t('saved_ok');
  toast(upd?msg+' '+t('plan_updated',upd):msg);
}
async function updatePlanFromWorkout(w){
  if(!w.planId)return '';
  const p=state.plans.find(x=>x.id===w.planId);if(!p)return '';
  const c=clone(p),d=(c.days||[]).find(x=>x.id===w.dayId);if(!d)return '';
  let changed=false;
  w.exercises.forEach(ex=>{
    const it=d.items.find(i=>i.name===ex.name);if(!it)return;
    if(it.lastDate&&it.lastDate>w.date)return;
    it.sets=ex.sets.map(x=>({w:x.w,r:x.r}));it.lastDate=w.date;changed=true;
  });
  if(!changed)return '';
  await saveDoc('plans',c,true);
  if(planDraft&&planDraft.id===c.id)planDraft=clone(c);
  return d.name;
}

async function gFetch(url,opt){opt=opt||{};const r=await fetch(url,Object.assign({},opt,{headers:Object.assign({Authorization:'Bearer '+gTok},opt.headers||{})}));if(r.status===401){gTok=null;try{localStorage.removeItem('gym-gtok')}catch(e){}throw new Error('auth')}if(r.status===404)throw new Error('404');if(!r.ok){let d='';try{const j=await r.json();const e=j.error||{};d=(e.errors&&e.errors[0]&&e.errors[0].reason)||e.status||e.message||''}catch(x){}if(/insufficient|PERMISSION_DENIED|forbidden/i.test(d)&&!/accessNotConfigured|SERVICE_DISABLED/i.test(d))gNeedConsent=true;throw new Error('http '+r.status+(d?' '+d:''))}return r}
async function gFindFile(){const q=encodeURIComponent("name='"+G_FILE+"' and trashed=false");const j=await (await gFetch('https://www.googleapis.com/drive/v3/files?q='+q+'&spaces=drive&orderBy=modifiedTime%20desc&fields=files(id)')).json();return j.files&&j.files[0]?j.files[0].id:null}
async function gUpload(id,data){
  const body=JSON.stringify(data);
  if(id){await gFetch('https://www.googleapis.com/upload/drive/v3/files/'+id+'?uploadType=media',{method:'PATCH',headers:{'Content-Type':'application/json'},body});return id}
  const bnd='repsody'+Date.now(),meta={name:G_FILE,mimeType:'application/json',description:'Repsody'};
  const mp='--'+bnd+'\r\nContent-Type: application/json; charset=UTF-8\r\n\r\n'+JSON.stringify(meta)+'\r\n--'+bnd+'\r\nContent-Type: application/json\r\n\r\n'+body+'\r\n--'+bnd+'--';
  const j=await (await gFetch('https://www.googleapis.com/upload/drive/v3/files?uploadType=multipart&fields=id',{method:'POST',headers:{'Content-Type':'multipart/related; boundary='+bnd},body:mp})).json();
  return j.id;
}
function mergeStates(a,b){
  const out=normalize({});
  out.del=Object.assign({},a.del||{});Object.entries(b.del||{}).forEach(([k,v])=>{if(!out.del[k]||out.del[k]<v)out.del[k]=v});
  for(const k of ['workouts','body','plans','habits']){
    const m=new Map();
    [...(a[k]||[]),...(b[k]||[])].forEach(o=>{if(!o||!o.id)return;const c=m.get(o.id);if(!c||(o.u||0)>(c.u||0))m.set(o.id,o)});
    out[k]=[...m.values()].filter(o=>!(out.del[o.id]&&out.del[o.id]>=(o.u||0)));
  }
  const act=out.plans.filter(p=>p.active).sort((x,y)=>(y.u||0)-(x.u||0));act.slice(1).forEach(p=>p.active=false);
  const ma=a.metaU||0,mb=b.metaU||0,src=mb>ma?b:a;
  out.favs=(src.favs||[]).slice();out.metaU=Math.max(ma,mb);
  const cm=new Map();[...(a.custom||[]),...(b.custom||[])].forEach(c=>cm.set(c.name,c));out.custom=[...cm.values()];
  const lim=Date.now()-180*DAY;Object.keys(out.del).forEach(k=>{if(out.del[k]<lim)delete out.del[k]});
  return out;
}
function setG(s){gState=s;renderChrome();const c=document.getElementById('g-status');if(c)c.textContent=gStatusTxt()}
function gStatusTxt(){
  if(gState==='syncing')return t('g_syncing');
  if(gState==='needtap')return t('g_needtap');
  if(gState==='offline')return t('g_offline');
  if(gState==='error')return t('g_error')+(gLastErr?' ('+gLastErr+')':'');
  return prefs.gLast?t('g_last',agoTxt(prefs.gLast)+' '+pad(new Date(prefs.gLast).getHours())+':'+pad(new Date(prefs.gLast).getMinutes())):t('g_connected');
}
async function gSync(interactive){
  if(gSyncing||!gClientId()||backend==='cloud')return;
  if(!navigator.onLine){setG('offline');return}
  gSyncing=true;setG('syncing');
  try{
    if(!gTok||Date.now()>gTokExp){if(!interactive&&!(NATIVE&&prefs.gConnected)){gSyncing=false;setG('needtap');return}await gAuth()}
    const first=!prefs.gConnected;
    if(!prefs.gEmail){try{const u=await (await gFetch('https://www.googleapis.com/oauth2/v3/userinfo')).json();prefs.gEmail=u.email||''}catch(e){}}
    prefs.gConnected=true;savePrefs();
    gFileId=gFileId||prefs.gFileId||null;
    let remote=null;
    if(!gFileId)gFileId=await gFindFile();
    if(gFileId){try{remote=await (await gFetch('https://www.googleapis.com/drive/v3/files/'+gFileId+'?alt=media')).json()}catch(e){if(e.message==='404'){gFileId=null;remote=null;gFileId=await gFindFile();if(gFileId)remote=await (await gFetch('https://www.googleapis.com/drive/v3/files/'+gFileId+'?alt=media')).json()}else throw e}}
    const rs=remote&&remote.app==='repsody'&&remote.data?normalize(remote.data):normalize({});
    state=mergeStates(state,rs);persistLocal();
    gFileId=await gUpload(gFileId,{app:'repsody',version:2,updated:new Date().toISOString(),data:state});
    prefs.gFileId=gFileId;prefs.gLast=Date.now();savePrefs();
    gSyncing=false;setG('ok');render();
    if(first)toast(t('g_first_ok'));
  }catch(e){
    gSyncing=false;
    const m=(e&&(e.message||e.error||e.type))||'?';
    gLastErr=String(m);
    if(e&&e.error==='scope'){setG('error');toast(t('g_scope'));return}
    if(/accessNotConfigured|SERVICE_DISABLED|has not been used/i.test(gLastErr)){setG('error');toast(t('g_api_off'));return}
    if(gNeedConsent){gTok=null;try{localStorage.removeItem('gym-gtok')}catch(x){}setG('error');toast(t('g_scope'));return}
    setG(e&&e.message==='auth'?'needtap':'error');
    if(interactive&&e&&(e.type==='popup_closed'||e.error==='access_denied'))toast(t('g_cancelled'));
  }
}
function gSchedule(){if(!gOn())return;clearTimeout(gSyncT);gSyncT=setTimeout(()=>gSync(false),2500)}
function gDisconnect(){try{if(gTok&&window.google&&google.accounts&&google.accounts.oauth2)google.accounts.oauth2.revoke(gTok,()=>{})}catch(e){}gTok=null;try{localStorage.removeItem('gym-gtok')}catch(e){}gFileId=null;prefs.gConnected=false;prefs.gEmail='';prefs.gFileId='';prefs.gLast=0;savePrefs();gState='';render()}
window.addEventListener('online',()=>{if(gOn()&&gTok&&Date.now()<gTokExp)gSchedule()});
document.addEventListener('visibilitychange',()=>{if(!document.hidden&&gOn()&&gTok&&Date.now()<gTokExp)gSchedule()});
function googleCard(){
  const cid=gClientId();
  if(backend==='cloud')return '';
  if(!cid)return `<section class="card">
    <h3>${t('g_h')}</h3>
    <p class="small muted" style="margin:4px 0 10px">${t('g_need_id')}</p>
    <label for="g-cid">${t('g_cid')}</label>
    <div class="row" style="flex-wrap:nowrap"><input id="g-cid" placeholder="123…apps.googleusercontent.com" autocomplete="off"><button data-action="g-cid-save" style="flex:none">${t('hb_save')}</button></div>
  </section>`;
  if(!prefs.gConnected)return `<section class="card">
    <h3>${t('g_h')}</h3>
    <p class="small muted" style="margin:4px 0 12px">${t('g_p')}</p>
    <button class="g-btn" data-action="g-connect"><span class="g-logo" aria-hidden="true">G</span>${t('g_connect')}</button>
    <p class="small muted" style="margin:10px 0 0">${t('g_privacy')}</p>
  </section>`;
  return `<section class="card">
    <h3>${t('g_h')}</h3>
    <p style="margin:6px 0 2px"><b>✓ ${t('g_as',esc(prefs.gEmail||'Google'))}</b></p>
    <p class="small muted" style="margin:0 0 12px" id="g-status">${gStatusTxt()}</p>
    <div class="row"><button class="primary-sm" data-action="g-sync">${t('g_sync_now')}</button><button class="ghost small" data-action="g-off">${t('g_disconnect')}</button></div>
    <p class="small muted" style="margin:10px 0 0">${t('g_how')}</p>
  </section>`;
}

/* ---------- kopia zapasowa ---------- */
function backupData(){return{app:'repsody',version:1,exported:new Date().toISOString(),data:{workouts:state.workouts,body:state.body,plans:state.plans,custom:state.custom,favs:state.favs,habits:state.habits},prefs:Object.assign({},prefs)}}
function agoTxt(ts){const d=Math.floor((parseD(today())-parseD(ymd(new Date(ts))))/DAY);return d<=0?t('ago_today'):d===1?t('ago_yday'):t('ago_days',d)}
async function exportBackup(){
  const json=JSON.stringify(backupData());const name='repsody-kopia-'+today()+'.json';
  const blob=new Blob([json],{type:'application/json'});let done=false;
  try{const file=new File([blob],name,{type:'application/json'});if(navigator.canShare&&navigator.canShare({files:[file]})){await navigator.share({files:[file],title:'Repsody'});done=true}}
  catch(e){if(e&&e.name==='AbortError')return}
  if(!done){try{const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download=name;document.body.appendChild(a);a.click();setTimeout(()=>{URL.revokeObjectURL(a.href);a.remove()},1500);done=true}catch(e){}}
  prefs.lastBackup=Date.now();savePrefs();toast(t('data_exported'));render();
}
async function importBackup(obj){
  const d=normalize(obj.data);let n=0;
  for(const kind of ['workouts','body','plans','habits']){for(const o of d[kind]){if(!o||!o.id)continue;await saveDoc(kind,o,true);if(kind==='workouts')n++}}
  d.custom.forEach(c=>{if(!state.custom.some(x=>x.name===c.name))state.custom.push(c)});
  d.favs.forEach(f=>{if(!state.favs.includes(f))state.favs.push(f)});
  persistLocal();await saveCustom();
  const act=state.plans.filter(p=>p.active);if(act.length>1)await activatePlan(act[act.length-1].id);
  render();toast(t('data_imported',n));
}
async function wipeAll(){
  if(backend==='cloud'){for(const k of ['workouts','body','plans','habits'])for(const o of state[k].slice())await removeDoc(k,o.id);state.custom=[];state.favs=[];await saveCustom()}
  const del=Object.assign({},state.del||{}),now=Date.now();['workouts','body','plans','habits'].forEach(k=>state[k].forEach(o=>del[o.id]=now));
  state=normalize({del,metaU:now});persistLocal();draft=newDraft();persistDraft();render();gSchedule();toast(t('data_wiped'));
}
function dataCard(){
  const lb=prefs.lastBackup,old=!lb||Date.now()-lb>30*DAY;
  return `<section class="card">
    <h3>${t('data_h')}</h3>
    <p class="small muted" style="margin:4px 0 8px">${t('data_p')}</p>
    <p class="small" style="margin:0 0 6px">${t('data_count',state.workouts.length,state.body.length,state.plans.length,state.habits.length)}</p>
    <p class="small" style="margin:0 0 10px"><b>${lb?t('data_last',agoTxt(lb)):t('data_never')}</b></p>
    ${old&&state.workouts.length>=3?`<p class="hint warn">${t('data_old')}</p>`:''}
    <div class="stack">
      <button class="primary" data-action="data-export">${t('data_export')}</button>
      <button data-action="data-import">${t('data_import')}</button>
      <input type="file" id="imp-file" accept=".json,application/json" hidden>
      <p class="small muted" style="margin:0">${t('data_import_note')}</p>
      <div class="row between"><button class="ghost small" data-action="data-copy">${t('data_copy')}</button><button class="ghost small danger" data-action="data-wipe">${t('data_wipe')}</button></div>
    </div>
  </section>`;
}

/* ---------- instalacja (PWA) ---------- */
let installEvt=null;
function isStandalone(){try{return window.matchMedia('(display-mode: standalone)').matches||navigator.standalone===true}catch(e){return false}}
window.addEventListener('beforeinstallprompt',e=>{e.preventDefault();installEvt=e;if(tab==='ustawienia')render()});
window.addEventListener('appinstalled',()=>{installEvt=null;if(tab==='ustawienia')render()});
if('serviceWorker' in navigator&&/^https?:$/.test(location.protocol)&&!window.claude&&!NATIVE){
  window.addEventListener('load',()=>{navigator.serviceWorker.register('sw.js').catch(()=>{})});
}

/* ---------- start ---------- */
function start(data){
  applySkin();
  if(data&&data.draft)draft=data.draft;
  if(data&&data.planDraft)planDraft=data.planDraft;
  if(!draft||!draft.exercises)draft=newDraft();
  if(!draft.wu)draft.wu='kg';
  if(draft.mode===undefined){draft.mode=draft.exercises.length?(draft.startedAt&&draft.date===today()&&!draft.id?'live':'manual'):null}
  convertDraft();
  const h0=location.hash.slice(1),h=h0==='pomoc'?'cialo':h0;tab=TABS.includes(h)?h:'trening';
  render();
  initCloud();
  if(prefs.gConnected&&gClientId())setTimeout(()=>gSync(false),800);
  if(RT){if(isLive())ntWorkout();else ntCall('stopWorkout')}
}
const hot=window.claude&&window.claude.hot;
if(hot&&typeof hot.snapshot==='function'){try{hot.snapshot(()=>({draft,planDraft}))}catch(e){}}
if(hot&&typeof hot.ready==='function')hot.ready(start);else start((hot&&hot.data)||{});
})();
